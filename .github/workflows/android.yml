name: Android build and checks
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - name: Verify Gson Maven artifacts
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, re, urllib.request, zipfile
          target = pathlib.Path("testengine/deps")
          target.mkdir(parents=True, exist_ok=True)
          for version, suffix in [("2.14.0", ""), ("2.14.0", "-sources"), ("2.11.0", "")]:
              name = f"gson-{version}{suffix}.jar"
              url = f"https://repo.maven.apache.org/maven2/com/google/code/gson/gson/{version}/{name}"
              with urllib.request.urlopen(url + ".sha1", timeout=60) as response:
                  published = response.read().decode("ascii").strip()
              if not re.fullmatch(r"[0-9a-fA-F]{40}", published):
                  raise RuntimeError(f"Invalid published checksum for {name}")
              with urllib.request.urlopen(url, timeout=60) as response:
                  data = response.read()
              if hashlib.sha1(data).hexdigest().lower() != published.lower():
                  raise RuntimeError(f"Published checksum mismatch for {name}")
              (target / name).write_bytes(data)
              print(f"ARTIFACT {name} PUBLISHED_SHA1 {published} SHA256 {hashlib.sha256(data).hexdigest()}")
              if suffix == "-sources":
                  with zipfile.ZipFile(target / name) as archive:
                      source = archive.read("com/google/gson/Gson.java").decode("utf-8")
                      print("GSON_SOURCE_HEADER_BEGIN")
                      print(source[:source.index("*/") + 2])
                      print("GSON_SOURCE_HEADER_END")
          PY
      - name: Build, lint and all unit tests
        run: bash gradlew assembleDebug lintDebug testDebugUnitTest --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-CI-test-build-not-upgrade-release
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            app/build/test-results/testDebugUnitTest/TEST-*.xml
          retention-days: 14
