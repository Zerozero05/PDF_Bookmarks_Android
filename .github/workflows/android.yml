name: Android build and checks
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build, lint and all unit tests
        run: bash gradlew assembleDebug lintDebug testDebugUnitTest --no-daemon --console=plain
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Android-CI-test-build-not-upgrade-release
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            app/build/test-results/testDebugUnitTest/TEST-*.xml
          retention-days: 14
