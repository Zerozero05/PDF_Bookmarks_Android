plugins { id 'com.android.application' }
configurations { legacyGson { transitive = false } }
def appVersion = rootProject.file('VERSION').text.trim()
android {
    namespace 'cn.local.pdfbookmarks'
    compileSdk 35
    buildToolsVersion '36.0.0'
    buildFeatures { resValues = true }
    defaultConfig {
        applicationId 'cn.local.pdfbookmarks'
        minSdk 26
        targetSdk 35
        versionCode 19
        versionName appVersion
        testInstrumentationRunner 'cn.local.pdfbookmarks.StartupSmoke'
        resValue 'string', 'app_version', appVersion
        resValue 'string', 'update_signer_sha256', rootProject.file('SIGNING_CERTIFICATE.sha256').text.trim()
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/versions/9/OSGI-INF/MANIFEST.MF']
    }
    buildTypes {
        release { minifyEnabled false }
        fixture {
            initWith debug
            applicationIdSuffix '.testhost'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
        }
    }
    testBuildType = providers.gradleProperty('fixtureTests').orNull == 'true' ? 'fixture' : 'debug'
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all {
            inputs.files(configurations.legacyGson)
            doFirst { systemProperty 'gson.legacyJar', configurations.legacyGson.singleFile.absolutePath }
            ['jasminum.fixture', 'jasminum.actualPageCount', 'enjoy.fixtureFolder', 'enjoy.mixedFixtureFolder'].each { key ->
                if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
            }
        }
    }
}
dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    testImplementation 'junit:junit:4.13.2'
    legacyGson 'com.google.code.gson:gson:2.11.0'
}
